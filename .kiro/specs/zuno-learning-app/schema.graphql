enum CatalogItemType {
  COURSE
  LESSON
  QUIZ
  COACH
  ACHIEVEMENT
  ASSESSMENT
}

type Course {
  title: String
  category: String
  difficultyLevel: String
}

type Lesson {
  courseId: ID
  title: String
  lessonOrder: Int
  lessonType: String
}

type Quiz {
  courseId: ID
  lessonId: ID
  questionText: String
  questionType: String
}

type Coach {
  coachType: String
  displayName: String
  avatarUrl: String
  bio: String
}

type Achievement {
  name: String
  requirementType: String
  xpReward: Int
  badgeIcon: String
}

