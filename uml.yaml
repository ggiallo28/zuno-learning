entity daily_activities { ok
  *id : SERIAL [PK]
  user_id : INT [FK]
  activity_date : DATE
}

entity user_coach_interactions { ok
  *id : SERIAL [PK]
  user_id : INT [FK]
  interaction_type : VARCHAR
}

entity user_knowledge_gaps { ok
  *id : SERIAL [PK]
  user_id : INT [FK]
  subject_area : VARCHAR
  concept_name : VARCHAR
}

entity spaced_repetition_schedule { ok
  *id : SERIAL [PK]
  user_id : INT [FK]
  content_id : INT
}

entity learning_groups {
  *id : SERIAL [PK]
  name : VARCHAR
  subject_area : VARCHAR
  created_by : INT [FK]
}

entity group_memberships {
  *id : SERIAL [PK]
  group_id : INT [FK]
  user_id : INT [FK]
}

entity group_activities {
  *id : SERIAL [PK]
  group_id : INT [FK]
  title : VARCHAR
  created_by : INT [FK]
}

entity user_learning_analytics { 
  *id : SERIAL [PK]
  user_id : INT [FK]
  metric_name : VARCHAR
}

entity offline_content_cache {
  *id : SERIAL [PK]
  user_id : INT [FK]
  content_type : VARCHAR
  content_id : INT
}

