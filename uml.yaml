@startuml
skinparam classAttributeIconSize 0
skinparam linetype ortho

entity users { user_id + metadata + type(users)
  *id : SERIAL [PK]
  email : VARCHAR
  username : VARCHAR
  full_name : VARCHAR
  subscription_tier : VARCHAR
  total_xp : INT
  current_level : INT
  coach_type : VARCHAR
  onboarding_completed : BOOLEAN
}

entity user_assessments { user_id + metadata + type(assessments)
  *id : SERIAL [PK]
  user_id : INT [FK]
  assessment_type : VARCHAR
  subject_area : VARCHAR
}

entity user_courses { user_id + catalog_id + type(courses)
  *id : SERIAL [PK]
  user_id : INT [FK]
  course_id : INT [FK] 
}

entity user_lesson_progress { user_id + catalog_id + type(courses)
  *id : SERIAL [PK]
  user_id : INT [FK]
  lesson_id : INT [FK]
}

entity catalog {
  *id : SERIAL [PK]

  title : VARCHAR

  category : VARCHAR
  difficulty_level : VARCHAR

  course_id : INT [FK]
  lesson_order : INT
  lesson_type : VARCHAR

  lesson_id : INT [FK]
  question_text : TEXT
  question_type : VARCHAR

  achievements
  coach_configs
}

